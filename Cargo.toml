[package]
name = "replay-host-doctor"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "AGPL-3.0-only"
description = "Fail-closed Linux X11/NVIDIA host readiness evidence"

[dependencies]
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["raw_value", "std"] }
sha2 = { version = "=0.11.0", default-features = false }
libloading = { version = "=0.9.0", default-features = false, features = ["std"] }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs", "process", "net"] }
x11rb = { version = "=0.14.0", default-features = false, features = ["randr"] }

