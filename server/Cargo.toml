[package]
name = "replay-control"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false
license = "AGPL-3.0-only"
description = "Single-organization ReplayDesktop control and direct-admission gateway"

[dependencies]
argon2 = { version = "=0.5.3", features = ["std"] }
async-trait = "=0.1.89"
axum = { version = "=0.8.4", features = ["http1", "json", "tokio"] }
base64 = "=0.22.1"
clap = { version = "=4.5.45", features = ["derive", "env"] }
ed25519-dalek = { version = "=2.2.0", features = ["pem", "pkcs8", "rand_core"] }
hex = "=0.4.3"
jsonwebtoken = { version = "=9.3.1", default-features = false, features = ["use_pem"] }
rand_core_06 = { package = "rand_core", version = "=0.6.4", features = ["getrandom"] }
reqwest = { version = "=0.12.23", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "=7.4.0"
rustls-pemfile = "=2.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sqlx = { version = "=0.8.6", default-features = false, features = ["macros", "migrate", "runtime-tokio-rustls", "sqlite", "uuid"] }
subtle = "=2.6.1"
thiserror = "=2.0.16"
tokio = { version = "=1.47.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "=0.5.2", features = ["limit", "util"] }
tower-http = { version = "=0.6.6", features = ["request-id", "trace"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "=1.18.0", features = ["serde", "v4"] }

[dev-dependencies]
rsa = { version = "=0.9.8", features = ["pem"] }
tempfile = "=3.21.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"

[[bin]]
name = "replay-control"
path = "src/main.rs"
