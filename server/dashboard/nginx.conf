server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz {
        access_log off;
        return 204;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /downloads/ReplayDesktop-v0.3.0-spike.6-arm64.zip {
        default_type application/zip;
        add_header Content-Disposition "attachment; filename=ReplayDesktop-v0.3.0-spike.6-arm64.zip" always;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
